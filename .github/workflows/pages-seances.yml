name: Actualiser les séances et publier

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, scripts/import_seances.py, .github/workflows/pages-seances.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Télécharger et valider les séances du SCARE
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/scare.csv" <<'PYTHON'
          import csv
          import hashlib
          import io
          import subprocess
          import sys
          from urllib.parse import urlencode

          endpoint = "https://datacinesindes.fr/data-fair/api/v1/datasets/programmation-cinemas/lines"
          size = 10000
          seen = set()
          with open(sys.argv[1], "w", encoding="utf-8", newline="") as output:
              writer = csv.writer(output)
              header = None
              for page in range(1, 101):
                  query = urlencode(dict(draft="false", size=size, page=page, format="csv", sep=","))
                  content = subprocess.check_output([
                      "curl", "--fail", "--silent", "--show-error", "--location",
                      "--retry", "2", "--max-time", "45", endpoint + "?" + query,
                  ])
                  reader = csv.reader(io.StringIO(content.decode("utf-8-sig"), newline=""), strict=True)
                  fields = next(reader, [])
                  if not {"filmtitle", "showstart", "cineid"}.issubset(fields):
                      raise ValueError(f"Page {page} : en-tête CSV inattendu.")
                  if header is None:
                      header = fields
                      writer.writerow(header)
                  elif fields != header:
                      raise ValueError(f"Page {page} : les colonnes ont changé.")
                  rows = list(reader)
                  if any(len(row) != len(header) for row in rows):
                      raise ValueError(f"Page {page} : ligne CSV incomplète.")
                  digest = hashlib.sha256(content).digest()
                  if rows and digest in seen:
                      raise ValueError(f"Page {page} : page répétée, import interrompu.")
                  seen.add(digest)
                  writer.writerows(rows)
                  print(f"Page {page} : {len(rows)} séances téléchargées.")
                  if len(rows) < size:
                      break
              else:
                  raise ValueError("Limite de pagination atteinte, import interrompu.")
          PYTHON
          python3 scripts/import_seances.py "$RUNNER_TEMP/scare.csv" index.html public/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
