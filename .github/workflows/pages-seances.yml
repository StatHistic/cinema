name: Actualiser les séances et publier

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, scripts/import_seances.py, scripts/telecharger_seances.py, .github/workflows/pages-seances.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Télécharger et valider les séances du SCARE
        run: |
          python3 scripts/telecharger_seances.py "$RUNNER_TEMP/scare.csv"
          python3 scripts/import_seances.py "$RUNNER_TEMP/scare.csv" index.html public/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
